[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-jarvis"
version = "1.0.0"
description = "APEX_JARVIS: Sovereign Real-Time Voice and Avatar Desktop Hypervisor"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Apex Growth Systems LLC"}
]
keywords = [
    "voice-agent",
    "jarvis",
    "autonomous-agents",
    "ai-agents",
    "computer-use",
    "desktop-automation",
    "talking-avatar",
    "visemes",
    "vad",
    "speech-to-text",
    "text-to-speech",
    "low-latency",
    "hypervisor",
    "local-ai",
    "sovereign-ai",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

[project.urls]
Homepage = "https://github.com/AAH20/apex-jarvis"
